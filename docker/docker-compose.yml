# docker/docker-compose.yml
name: struct

# ---------------------------------------------------------------------------
# Shared configuration anchors (YAML merge keys)
# ---------------------------------------------------------------------------

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"
    tag: "{{.Name}}|{{.ID}}"

x-restart: &default-restart
  restart: unless-stopped
  stop_grace_period: 30s
  stop_signal: SIGTERM

x-service-labels: &default-labels
  org.opencontainers.image.title: struct-framework
  org.opencontainers.image.licenses: MIT

# Strict security baseline — for the Go API (distroless, static binary,
# runs as nonroot, doesn't need any Linux capabilities).
x-security-api: &security-api
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

# Lighter security touch for official DB/infra images.  They need a few
# capabilities for setuid/setgid/chroot during bootstrap; we still
# prevent any new privileges after exec.
x-security-infra: &security-infra
  security_opt:
    - no-new-privileges:true

# ---------------------------------------------------------------------------
# Services
# ---------------------------------------------------------------------------

services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        VERSION: ${APP_VERSION:-1.0.0}
        COMMIT: ${GIT_COMMIT:-unknown}
    image: struct-framework-api:${IMAGE_TAG:-latest}
    <<: [*default-restart, *security-api]
    labels: *default-labels
    logging: *default-logging
    init: true
    ports:
      - "${API_HOST:-127.0.0.1}:${API_PORT:-8080}:8080"
    env_file:
      - path: ../.env
        required: false
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_NAME: ${APP_NAME:-struct-framework}
      APP_VERSION: ${APP_VERSION:-1.0.0}
      SERVICE_NAME: ${SERVICE_NAME:-struct-framework}
      PORT: "8080"
      DB_DRIVER: ${DB_DRIVER:-postgres}
      DATABASE_URL: ${DATABASE_URL:-postgres://svc:secret@postgres:5432/svc?sslmode=disable}
      MESSAGE_BROKER: ${MESSAGE_BROKER:-memory}
      BROKER_URL: ${BROKER_URL:-redis://redis:6379/0}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      DEFAULT_LOCALE: ${DEFAULT_LOCALE:-en}
      SUPPORTED_LOCALES: ${SUPPORTED_LOCALES:-en,es}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      PPROF_ENABLED: ${PPROF_ENABLED:-true}
      RATE_LIMIT_RPS: ${RATE_LIMIT_RPS:-20}
      READ_TIMEOUT: ${READ_TIMEOUT:-5s}
      WRITE_TIMEOUT: ${WRITE_TIMEOUT:-10s}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-15s}
      DB_MAX_OPEN_CONNS: ${DB_MAX_OPEN_CONNS:-25}
      DB_MAX_IDLE_CONNS: ${DB_MAX_IDLE_CONNS:-10}
      DB_CONN_MAX_LIFETIME: ${DB_CONN_MAX_LIFETIME:-15m}
      OUTBOX_RELAY_ENABLED: ${OUTBOX_RELAY_ENABLED:-false}
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "/app/struct", "health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: ${API_CPU_LIMIT:-2.0}
          memory: ${API_MEM_LIMIT:-512M}
        reservations:
          cpus: "0.25"
          memory: 128M
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    networks:
      backend:
      frontend:

  postgres:
    image: postgres:18-alpine
    <<: [*default-restart, *security-infra]
    labels: *default-labels
    logging: *default-logging
    user: postgres
    ports:
      - "${DB_HOST:-127.0.0.1}:${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${DB_USERNAME:-svc}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
      POSTGRES_DB: ${DB_DATABASE:-svc}
      PGDATA: /var/lib/postgresql/data
    command:
      - postgres
      - -c
      - max_connections=${PG_MAX_CONNS:-100}
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-128MB}
      - -c
      - effective_cache_size=${PG_CACHE_SIZE:-384MB}
      - -c
      - work_mem=${PG_WORK_MEM:-4MB}
      - -c
      - maintenance_work_mem=${PG_MAINT_MEM:-32MB}
      - -c
      - password_encryption=md5
      - -c
      - ssl=off
    volumes:
      - pgdata:/var/lib/postgresql
      - ./init-db/99-auth-method.sh:/docker-entrypoint-initdb.d/99-auth-method.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-svc} -d ${DB_DATABASE:-svc}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: ${PG_CPU_LIMIT:-1.0}
          memory: ${PG_MEM_LIMIT:-512M}
        reservations:
          cpus: "0.1"
          memory: 64M
    networks:
      backend:

  # mysql:
  #   profiles:
  #     - mysql
  #   image: mysql:9
  #   <<: [*default-restart, *security-infra]
  #   labels: *default-labels
  #   logging: *default-logging
