  #     MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
  #     MYSQL_DATABASE: ${DB_DATABASE:-svc}
  #     MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
  #   command:
  #     - --innodb-buffer-pool-size=${MYSQL_BUFFER_POOL:-128M}
  #     - --max-connections=${MYSQL_MAX_CONNS:-100}
  #   volumes:
  #     - mysqldata:/var/lib/mysql
  #   healthcheck:
  #     test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
  #     interval: 5s
  #     timeout: 3s
  #     retries: 5
  #     start_period: 15s
  #   deploy:
  #     resources:
  #       limits:
  #         cpus: ${MYSQL_CPU_LIMIT:-1.0}
  #         memory: ${MYSQL_MEM_LIMIT:-512M}
  #       reservations:
  #         cpus: "0.1"
  #         memory: 64M
  #   networks:
  #     backend:

  redis:
    image: redis:8-alpine
    <<: [*default-restart, *security-infra]
    labels: *default-labels
    logging: *default-logging
    user: redis
    ports:
      - "${REDIS_HOST:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - ${REDIS_MAX_MEMORY:-256mb}
      - --maxmemory-policy
      - ${REDIS_POLICY:-allkeys-lru}
      - --save
      - "60"
      - "100"
      - --timeout
      - "300"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: ${REDIS_CPU_LIMIT:-0.5}
          memory: ${REDIS_MEM_LIMIT:-320M}
        reservations:
          cpus: "0.05"
          memory: 32M
    networks:
      backend:

# ---------------------------------------------------------------------------
# Networks, volumes
# ---------------------------------------------------------------------------

networks:
  frontend:
    name: struct-frontend
    driver: bridge
  backend:
    name: struct-backend
    driver: bridge
    internal: false

volumes:
  pgdata:
    name: struct-pgdata
    driver: local
    labels:
      <<: *default-labels
      description: PostgreSQL data volume
  redisdata:
    name: struct-redisdata
    driver: local
    labels:
      <<: *default-labels
      description: Redis data volume
