# docker/docker-compose.yml
#
# Pass 1 scope: the API service only, running on the in-memory user store.
# Pass 3 (the store layer) will add `postgres` and `mysql` services plus a
# DB_DRIVER switch, per STRUCT_FRAMEWORK.md §14.2.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"
    tag: "{{.Name}}|{{.ID}}"

x-restart: &default-restart
  restart: unless-stopped
  stop_grace_period: 30s
  stop_signal: SIGTERM

x-service-labels: &default-labels
  org.opencontainers.image.title: __MODULE_PLACEHOLDER__
  org.opencontainers.image.licenses: MIT

x-security-api: &security-api
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

x-security-infra: &security-infra
  security_opt:
    - no-new-privileges:true

services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        VERSION: ${APP_VERSION:-1.0.0}
        COMMIT: ${GIT_COMMIT:-unknown}
    image: __MODULE_PLACEHOLDER__-api:${IMAGE_TAG:-latest}
    <<: [*default-restart, *security-api]
    labels: *default-labels
    logging: *default-logging
    init: true
    ports:
      - "${API_HOST:-127.0.0.1}:${API_PORT:-8080}:8080"
    env_file:
      - path: ../.env
        required: false
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_NAME: ${APP_NAME:-__MODULE_PLACEHOLDER__}
      APP_VERSION: ${APP_VERSION:-1.0.0}
      SERVICE_NAME: ${SERVICE_NAME:-__MODULE_PLACEHOLDER__}
      PORT: "8080"
      DEFAULT_LOCALE: ${DEFAULT_LOCALE:-en}
      SUPPORTED_LOCALES: ${SUPPORTED_LOCALES:-en,es}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      PPROF_ENABLED: ${PPROF_ENABLED:-true}
      RATE_LIMIT_RPS: ${RATE_LIMIT_RPS:-20}
      READ_TIMEOUT: ${READ_TIMEOUT:-5s}
      WRITE_TIMEOUT: ${WRITE_TIMEOUT:-10s}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-15s}
      DB_DRIVER: ${DB_DRIVER:-memory}
    healthcheck:
      test: ["CMD", "/app/struct", "health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: ${API_CPU_LIMIT:-2.0}
          memory: ${API_MEM_LIMIT:-512M}
        reservations:
          cpus: "0.25"
          memory: 128M
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    networks:
      backend:
      frontend:

networks:
  frontend:
    name: __MODULE_PLACEHOLDER__-frontend
    driver: bridge
  backend:
    name: __MODULE_PLACEHOLDER__-backend
    driver: bridge
    internal: false
