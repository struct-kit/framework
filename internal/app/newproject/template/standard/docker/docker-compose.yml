# docker/docker-compose.yml
#
# Pass 1 scope: the API service only, running on the in-memory user store.
# Pass 3 (the store layer) will add `postgres` and `mysql` services plus a
# DB_DRIVER switch, per STRUCT_FRAMEWORK.md §14.2.
services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: __MODULE_PLACEHOLDER__-api:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      APP_ENV: development
      SERVICE_NAME: __MODULE_PLACEHOLDER__
      PORT: "8080"
      LOG_LEVEL: debug
    healthcheck:
      test: ["CMD", "/app/struct", "health"]
      interval: 10s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
